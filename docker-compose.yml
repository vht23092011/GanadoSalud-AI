services:

  # ===================================
  # BACKEND - GANADOSALUD AI
  # ===================================
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ===================================
  # FRONTEND - REACT
  # ===================================
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ===================================
  # PROMETHEUS
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ganadosalud_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ===================================
  # GRAFANA
  # ===================================
  grafana:
    image: grafana/grafana:latest
    container_name: ganadosalud_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ===================================
  # ALERTMANAGER
  # ===================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ganadosalud_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped


volumes:
  prometheus_data:
  grafana_data: